name: "Multi-Event router and markdown reporter"

on:
    push:
        branches:
            - main
    schedule:
        - cron: '0 0 * * *' 

jobs:
    check_events:
        runs-on: ubuntu-latest
        steps:
              # this step should check if the event is a push or a schedule and print a message accordingly
              # event_name is a default context variable that can be used to determine the event type
            - name: Check event type
              id: event_type
              run: |
                if [[ "${{ github.event_name }}" == "push"]]; then
                    echo "This is a continuous integration build."
                elif [[ "${{ github.event_name }}" == "schedule" ]]; then
                    echo "This is a nightly audit."
                fi
            
            # second step -> generate a custom markdown report that will appear on the workflow run summary page
            - name: Generate markdown report
              run: |
                echo "## Workflow summary " >> $GITHUB_STEP_SUMMARY
                echo "** Event type:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
                echo " Column 1 | Column 2 " >> $GITHUB_STEP_SUMMARY
                echo " -- | -- " >> $GITHUB_STEP_SUMMARY
                echo " -- | -- " >> $GITHUB_STEP_SUMMARY
